name: Laravel installation and database smoke test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  laravel-smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: local-ci-only
          MYSQL_DATABASE: school_management_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -plocal-ci-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_NAME: SchoolManagementCI
      APP_ENV: testing
      APP_DEBUG: 'true'
      APP_URL: http://127.0.0.1
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: school_management_ci
      DB_USERNAME: root
      DB_PASSWORD: local-ci-only
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, pdo_mysql, bcmath, xml, curl, zip
          tools: composer:v2
          coverage: none
      - name: Prepare Laravel writable directories
        run: |
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          chmod -R u+rwX bootstrap/cache storage
      - name: Validate Composer metadata
        run: composer validate --no-check-publish
      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Generate and export application key
        run: echo "APP_KEY=$(php artisan key:generate --show)" >> "$GITHUB_ENV"
      - name: Migrate reconstructed schema
        run: php artisan migrate --force --no-interaction
      - name: Verify route registration
        run: php artisan route:list
